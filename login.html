<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MenuFlow — Войти</title>
  <link rel="icon" href="favicon.ico"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; flex-direction: column; min-height: 100vh; }
    nav { background: #fff; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .nav-logo { font-size: 1.3rem; font-weight: 700; color: #1a7a3c; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-logo::before { content: "🍽"; font-size: 1.4rem; }
    .lang-btns { display: flex; gap: 6px; }
    .lang-btn { border: none; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: .85rem; font-weight: 600; color: #555; }
    .lang-btn.active { background: #1a7a3c; color: #fff; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.09); padding: 40px 36px; width: 100%; max-width: 460px; }
    .card-logo { text-align: center; font-size: 2.4rem; margin-bottom: 4px; }
    h1 { text-align: center; font-size: 1.5rem; color: #1a1a1a; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #777; font-size: .9rem; margin-bottom: 24px; }
    .alert { border-radius: 10px; padding: 12px 16px; font-size: .9rem; margin-bottom: 18px; display: none; }
    .alert.error { background: #fdecea; color: #b71c1c; display: block; }
    .alert.success { background: #e8f5e9; color: #1b5e20; display: block; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: .88rem; font-weight: 600; color: #333; margin-bottom: 6px; }
    input[type=text], input[type=email], input[type=password] { width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-size: .95rem; transition: border .2s; outline: none; }
    input:focus { border-color: #1a7a3c; }
    input.invalid { border-color: #e53935; }
    .err-msg { font-size: .8rem; color: #e53935; margin-top: 4px; display: none; }
    .err-msg.show { display: block; }
    .theme-label { font-size: .88rem; font-weight: 600; color: #333; margin-bottom: 10px; }
    .themes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .theme-dot { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border .15s, transform .15s; }
    .theme-dot:hover { transform: scale(1.1); }
    .theme-dot.selected { border-color: #222; transform: scale(1.15); }
    .btn-submit { width: 100%; padding: 13px; background: #1a7a3c; color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover:not(:disabled) { background: #155f2f; }
    .btn-submit:disabled { opacity: .65; cursor: default; }
    .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-link { text-align: center; margin-top: 20px; font-size: .88rem; color: #666; }
    .footer-link a { color: #1a7a3c; font-weight: 600; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
    .divider { text-align: center; color: #aaa; margin: 16px 0; font-size: .85rem; }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">MenuFlow</a>
  <div class="lang-btns">
    <button class="lang-btn" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('lv')">LV</button>
  </div>
</nav>
<main>
  <div class="card">
    <div class="card-logo">🍽</div>
    <h1 id="t-title">Войти</h1>
    <p class="subtitle" id="t-subtitle">Войдите в свой аккаунт MenuFlow</p>
    <div class="alert" id="alert"></div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label id="t-emailLabel">Электронная почта</label>
        <input type="email" id="email" placeholder="owner@restaurant.com" autocomplete="email"/>
        <div class="err-msg" id="err-email"></div>
      </div>
      <div class="form-group">
        <label id="t-passLabel">Пароль</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
        <div class="err-msg" id="err-pass"></div>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="t-btn">Войти</span>
      </button>
    </form>
    <div class="divider" id="t-or">или</div>
    <div class="footer-link">
      <span id="t-noAccount">Нет аккаунта?</span>
      <a href="register.html" id="t-register">Зарегистрироваться</a>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
    var MF_DB = supabase.createClient('https://axidlwsjtgpehogbbjnt.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4aWRsd3NqdGdwZWhvZ2Jiam50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNTEwNzgsImV4cCI6MjA5MjgyNzA3OH0.wPkXnLrxWHnRKnc1uMv1Z7YRcRDaOI2BiIAEInx3DIs');
  var currentLang = localStorage.getItem('mf_lang') || 'ru';
  var T = {
    ru: { title:'Войти', subtitle:'Войдите в свой аккаунт MenuFlow', emailLabel:'Электронная почта', passLabel:'Пароль', btn:'Войти', loading:'Загрузка...', or:'или', noAccount:'Нет аккаунта?', register:'Зарегистрироваться', errEmail:'Введите корректный e-mail', errPass:'Введите пароль', errInvalid:'Неверный e-mail или пароль', errGeneral:'Ошибка. Попробуйте ещё раз.' },
    en: { title:'Sign In', subtitle:'Sign in to your MenuFlow account', emailLabel:'Email', passLabel:'Password', btn:'Sign In', loading:'Loading...', or:'or', noAccount:'No account?', register:'Sign Up', errEmail:'Enter a valid email', errPass:'Enter your password', errInvalid:'Invalid email or password', errGeneral:'Error. Please try again.' },
    lv: { title:'Ieiet', subtitle:'Ieiet savā MenuFlow kontā', emailLabel:'E-pasts', passLabel:'Parole', btn:'Ieiet', loading:'Ielādē...', or:'vai', noAccount:'Nav konta?', register:'Reģistrēties', errEmail:'Ievadiet pareizu e-pastu', errPass:'Ievadiet paroli', errInvalid:'Nepareizs e-pasts vai parole', errGeneral:'Kļūda. Mēģiniet vēlreiz.' }
  };
  function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('mf_lang', lang);
    applyLang();
  }
  function updateLangBtns() {
    document.querySelectorAll('.lang-btn').forEach(function(b) {
      b.classList.toggle('active', b.textContent === currentLang.toUpperCase());
    });
  }
  function applyLang() {
    var l = T[currentLang];
    document.getElementById('t-title').textContent      = l.title;
    document.getElementById('t-subtitle').textContent   = l.subtitle;
    document.getElementById('t-emailLabel').textContent = l.emailLabel;
    document.getElementById('t-passLabel').textContent  = l.passLabel;
    document.getElementById('t-btn').textContent        = l.btn;
    document.getElementById('t-or').textContent         = l.or;
    document.getElementById('t-noAccount').textContent  = l.noAccount;
    document.getElementById('t-register').textContent   = l.register;
    document.getElementById('err-email').textContent    = l.errEmail;
    document.getElementById('err-pass').textContent     = l.errPass;
    updateLangBtns();
  }
  function showErr(errId, inputId) {
    document.getElementById(errId).classList.add('show');
    document.getElementById(inputId).classList.add('invalid');
  }
  function clearErrors() {
    document.querySelectorAll('.err-msg').forEach(function(e){ e.classList.remove('show'); });
    document.querySelectorAll('input').forEach(function(i){ i.classList.remove('invalid'); });
    var a = document.getElementById('alert'); a.className = 'alert'; a.style.display = 'none';
  }
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault(); clearErrors();
    var email = document.getElementById('email').value.trim();
    var pass  = document.getElementById('password').value;
    var lang  = currentLang; var valid = true;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('err-email','email'); valid=false; }
    if (!pass)                                          { showErr('err-pass','password'); valid=false; }
    if (!valid) return;
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>' + T[lang].loading;
    try {
      var res = await MF_DB.auth.signInWithPassword({ email: email, password: pass });
      var alertEl = document.getElementById('alert');
      if (res.error) {
        alertEl.className = 'alert error'; alertEl.textContent = T[lang].errInvalid; alertEl.style.display = 'block';
      } else {
        window.location.href = 'app.html';
      }
    } catch(err) {
      var alertEl = document.getElementById('alert');
      alertEl.className = 'alert error'; alertEl.textContent = T[currentLang].errGeneral; alertEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.innerHTML = '<span id="t-btn">' + T[currentLang].btn + '</span>';
    }
  });
  applyLang();
</script>
</body>
</html>
