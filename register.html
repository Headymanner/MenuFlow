<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MenuFlow — Регистрация</title>
  <link rel="icon" href="favicon.ico"/>
  <style>
    :root { --accent: #3B5BDB; --accent-dark: #2d4abf; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; flex-direction: column; min-height: 100vh; }
    nav { background: #fff; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .nav-logo { font-size: 1.3rem; font-weight: 700; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-logo::before { content: "🍽"; font-size: 1.4rem; }
    .lang-btns { display: flex; gap: 6px; }
    .lang-btn { border: none; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: .85rem; font-weight: 600; color: #555; }
    .lang-btn.active { background: var(--accent); color: #fff; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.09); padding: 40px 36px; width: 100%; max-width: 460px; }
    .card-logo { text-align: center; font-size: 2.4rem; margin-bottom: 4px; }
    h1 { text-align: center; font-size: 1.5rem; color: #1a1a1a; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #777; font-size: .9rem; margin-bottom: 24px; }
    .alert { border-radius: 10px; padding: 12px 16px; font-size: .9rem; margin-bottom: 18px; display: none; }
    .alert.error { background: #fdecea; color: #b71c1c; display: block; }
    .alert.success { background: #e8f5e9; color: #1b5e20; display: block; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: .88rem; font-weight: 600; color: #333; margin-bottom: 6px; }
    input[type=text], input[type=email], input[type=password] { width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-size: .95rem; transition: border .2s; outline: none; }
    input:focus { border-color: var(--accent); }
    input.invalid { border-color: #e53935; }
    .err-msg { font-size: .8rem; color: #e53935; margin-top: 4px; display: none; }
    .err-msg.show { display: block; }
    .theme-label { font-size: .88rem; font-weight: 600; color: #333; margin-bottom: 10px; }
    .themes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .theme-dot { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border .15s, transform .15s; }
    .theme-dot:hover { transform: scale(1.1); }
    .theme-dot.selected { border-color: #222; transform: scale(1.15); }
    .btn-submit { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover:not(:disabled) { background: var(--accent-dark); }
    .btn-submit:disabled { opacity: .65; cursor: default; }
    .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-link { text-align: center; margin-top: 20px; font-size: .88rem; color: #666; }
    .footer-link a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
    .divider { text-align: center; color: #aaa; margin: 16px 0; font-size: .85rem; }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">MenuFlow</a>
  <div class="lang-btns">
    <button class="lang-btn" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('lv')">LV</button>
  </div>
</nav>
<main>
  <div class="card">
    <div class="card-logo">🍽</div>
    <h1 id="t-title">Создать аккаунт</h1>
    <p class="subtitle" id="t-subtitle">Создайте меню своего ресторана бесплатно</p>
    <div class="alert" id="alert"></div>
    <form id="registerForm" novalidate>
      <div class="form-group">
        <label id="t-nameLabel">Название ресторана</label>
        <input type="text" id="restaurantName" autocomplete="organization"/>
        <div class="err-msg" id="err-name"></div>
      </div>
      <div class="form-group">
        <label id="t-emailLabel">Электронная почта</label>
        <input type="email" id="email" autocomplete="email"/>
        <div class="err-msg" id="err-email"></div>
      </div>
      <div class="form-group">
        <label id="t-passLabel">Пароль</label>
        <input type="password" id="password" autocomplete="new-password"/>
        <div class="err-msg" id="err-pass"></div>
      </div>
      <div class="form-group">
        <label id="t-confirmLabel">Подтвердить пароль</label>
        <input type="password" id="confirmPassword" autocomplete="new-password"/>
        <div class="err-msg" id="err-confirm"></div>
      </div>
      <p class="theme-label" id="t-themeLabel">Выберите тему оформления:</p>
      <div class="themes">
        <div class="theme-dot selected" style="background:#3B5BDB" data-theme="blue"   data-color="#3B5BDB" data-dark="#2d4abf" onclick="selectTheme(this)"></div>
        <div class="theme-dot"          style="background:#2E7D32" data-theme="green"  data-color="#2E7D32" data-dark="#1b5e20" onclick="selectTheme(this)"></div>
        <div class="theme-dot"          style="background:#E65100" data-theme="orange" data-color="#E65100" data-dark="#bf360c" onclick="selectTheme(this)"></div>
        <div class="theme-dot"          style="background:#C62828" data-theme="red"    data-color="#C62828" data-dark="#8e0000" onclick="selectTheme(this)"></div>
        <div class="theme-dot"          style="background:#6A1B9A" data-theme="purple" data-color="#6A1B9A" data-dark="#4a148c" onclick="selectTheme(this)"></div>
        <div class="theme-dot"          style="background:#00838F" data-theme="teal"   data-color="#00838F" data-dark="#005662" onclick="selectTheme(this)"></div>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="t-btn">Создать аккаунт</span>
      </button>
    </form>
    <div class="divider" id="t-or">или</div>
    <div class="footer-link">
      <span id="t-hasAccount">Уже есть аккаунт?</span>
      <a href="login.html" id="t-login">Войти</a>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  var MF_DB = supabase.createClient('https://axidlwsjtgpehogbbjnt.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4aWRsd3NqdGdwZWhvZ2Jiam50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNTEwNzgsImV4cCI6MjA5MjgyNzA3OH0.wPkXnLrxWHnRKnc1uMv1Z7YRcRDaOI2BiIAEInx3DIs');
  var currentLang = localStorage.getItem('mf_lang') || 'ru';
  var currentTheme = 'blue';

  var T = {
    ru: {
      title:'Создать аккаунт', subtitle:'Создайте меню своего ресторана бесплатно',
      nameLabel:'Название ресторана', namePH:'My Restaurant',
      emailLabel:'Электронная почта', emailPH:'owner@restaurant.com',
      passLabel:'Пароль', passPH:'Минимум 8 символов',
      confirmLabel:'Подтвердить пароль', confirmPH:'Повторите пароль',
      themeLabel:'Выберите тему оформления:',
      btn:'Создать аккаунт', loading:'Загрузка...', or:'или',
      hasAccount:'Уже есть аккаунт?', login:'Войти',
      errName:'Введите название ресторана', errEmail:'Введите корректный e-mail',
      errPass:'Минимум 8 символов', errConfirm:'Пароли не совпадают',
      successMsg:'Аккаунт создан! Войдите в систему.',
      errEmailTaken:'Этот e-mail уже используется', errGeneral:'Ошибка. Попробуйте ещё раз.'
    },
    en: {
      title:'Create Account', subtitle:'Create your restaurant menu for free',
      nameLabel:'Restaurant Name', namePH:'My Restaurant',
      emailLabel:'Email', emailPH:'owner@restaurant.com',
      passLabel:'Password', passPH:'Minimum 8 characters',
      confirmLabel:'Confirm Password', confirmPH:'Repeat password',
      themeLabel:'Choose a theme:',
      btn:'Create Account', loading:'Loading...', or:'or',
      hasAccount:'Already have an account?', login:'Sign In',
      errName:'Enter restaurant name', errEmail:'Enter a valid email',
      errPass:'Minimum 8 characters', errConfirm:'Passwords do not match',
      successMsg:'Account created! Sign in now.',
      errEmailTaken:'This email is already in use', errGeneral:'Error. Please try again.'
    },
    lv: {
      title:'Izveidot kontu', subtitle:'Izveidojiet sava restorāna izvēlni bez maksas',
      nameLabel:'Restorāna nosaukums', namePH:'Mans restorāns',
      emailLabel:'E-pasts', emailPH:'owner@restaurant.com',
      passLabel:'Parole', passPH:'Vismaz 8 rakstzīmes',
      confirmLabel:'Apstiprināt paroli', confirmPH:'Atkārtojiet paroli',
      themeLabel:'Izvēlieties tēmu:',
      btn:'Izveidot kontu', loading:'Ielādē...', or:'vai',
      hasAccount:'Jau ir konts?', login:'Ieiet',
      errName:'Ievadiet restorāna nosaukumu', errEmail:'Ievadiet pareizu e-pastu',
      errPass:'Vismaz 8 rakstzīmes', errConfirm:'Paroles nesakrīt',
      successMsg:'Konts izveidots! Ieiet tagad.',
      errEmailTaken:'Šis e-pasts jau tiek izmantots', errGeneral:'Kļūda. Mēģiniet vēlreiz.'
    }
  };

  function setLang(lang) { currentLang = lang; localStorage.setItem('mf_lang', lang); applyLang(); }

  function applyLang() {
    var l = T[currentLang];
    document.getElementById('t-title').textContent        = l.title;
    document.getElementById('t-subtitle').textContent     = l.subtitle;
    document.getElementById('t-nameLabel').textContent    = l.nameLabel;
    document.getElementById('t-emailLabel').textContent   = l.emailLabel;
    document.getElementById('t-passLabel').textContent    = l.passLabel;
    document.getElementById('t-confirmLabel').textContent = l.confirmLabel;
    document.getElementById('t-themeLabel').textContent   = l.themeLabel;
    document.getElementById('t-btn').textContent          = l.btn;
    document.getElementById('t-or').textContent           = l.or;
    document.getElementById('t-hasAccount').textContent   = l.hasAccount;
    document.getElementById('t-login').textContent        = l.login;
    document.getElementById('err-name').textContent       = l.errName;
    document.getElementById('err-email').textContent      = l.errEmail;
    document.getElementById('err-pass').textContent       = l.errPass;
    document.getElementById('err-confirm').textContent    = l.errConfirm;
    // ✅ Плейсхолдеры тоже обновляем
    document.getElementById('restaurantName').placeholder = l.namePH;
    document.getElementById('email').placeholder          = l.emailPH;
    document.getElementById('password').placeholder       = l.passPH;
    document.getElementById('confirmPassword').placeholder= l.confirmPH;
    document.querySelectorAll('.lang-btn').forEach(function(b) {
      b.classList.toggle('active', b.textContent === currentLang.toUpperCase());
    });
  }

  function selectTheme(el) {
    document.querySelectorAll('.theme-dot').forEach(function(d) { d.classList.remove('selected'); });
    el.classList.add('selected');
    currentTheme = el.getAttribute('data-theme');
    document.documentElement.style.setProperty('--accent',      el.getAttribute('data-color'));
    document.documentElement.style.setProperty('--accent-dark', el.getAttribute('data-dark'));
  }

  function showErr(errId, inputId) {
    document.getElementById(errId).classList.add('show');
    document.getElementById(inputId).classList.add('invalid');
  }
  function clearErrors() {
    document.querySelectorAll('.err-msg').forEach(function(e) { e.classList.remove('show'); });
    document.querySelectorAll('input').forEach(function(i) { i.classList.remove('invalid'); });
    var a = document.getElementById('alert'); a.className = 'alert'; a.style.display = 'none';
  }

  document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault(); clearErrors();
    var name    = document.getElementById('restaurantName').value.trim();
    var email   = document.getElementById('email').value.trim();
    var pass    = document.getElementById('password').value;
    var confirm = document.getElementById('confirmPassword').value;
    var lang = currentLang; var valid = true;
    if (!name)                                          { showErr('err-name','restaurantName'); valid=false; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('err-email','email'); valid=false; }
    if (pass.length < 8)                               { showErr('err-pass','password'); valid=false; }
    if (pass !== confirm)                              { showErr('err-confirm','confirmPassword'); valid=false; }
    if (!valid) return;
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>' + T[lang].loading;
    try {
      var res = await MF_DB.auth.signUp({ email: email, password: pass, options: { data: { restaurant_name: name, theme: currentTheme, lang: currentLang } } });
      var alertEl = document.getElementById('alert');
      if (res.error) {
        alertEl.className = 'alert error';
        alertEl.textContent = res.error.message.toLowerCase().includes('already') ? T[lang].errEmailTaken : T[lang].errGeneral;
        alertEl.style.display = 'block';
      } else {
        alertEl.className = 'alert success'; alertEl.textContent = T[lang].successMsg; alertEl.style.display = 'block';
        document.getElementById('registerForm').reset();
        setTimeout(function() { window.location.href = 'login.html'; }, 2000);
      }
    } catch(err) {
      var alertEl = document.getElementById('alert');
      alertEl.className = 'alert error'; alertEl.textContent = T[currentLang].errGeneral; alertEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.innerHTML = '<span id="t-btn">' + T[currentLang].btn + '</span>';
    }
  });

  applyLang();
</script>
</body>
</html>
