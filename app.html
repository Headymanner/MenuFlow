<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MenuFlow — Дашборд</title>
  <link rel="icon" href="favicon.ico"/>
  <style>
    :root { --accent: #3B5BDB; --accent-dark: #2d4abf; --sidebar: 240px; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar { width: var(--sidebar); background: #1e1e2e; color: #fff; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
    .sidebar-logo { padding: 24px 20px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .sidebar-logo .app-name { font-size: 1.2rem; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .sidebar-logo .rest-name { font-size: .8rem; color: #aaa; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-nav { flex: 1; padding: 16px 0; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; color: #ccc; font-size: .92rem; transition: background .15s, color .15s; border-left: 3px solid transparent; }
    .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .nav-item.active { background: rgba(255,255,255,.1); color: #fff; border-left-color: var(--accent); }
    .nav-item .icon { font-size: 1.1rem; width: 22px; text-align: center; }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.08); }
    .btn-logout { width: 100%; padding: 10px; background: rgba(255,255,255,.07); border: none; border-radius: 8px; color: #ccc; cursor: pointer; font-size: .88rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s; }
    .btn-logout:hover { background: rgba(255,80,80,.2); color: #ff6b6b; }

    /* MAIN */
    .main { margin-left: var(--sidebar); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: #fff; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .topbar h1 { font-size: 1.2rem; color: #1a1a1a; }
    .lang-btns { display: flex; gap: 6px; }
    .lang-btn { border: none; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: .82rem; font-weight: 600; color: #666; }
    .lang-btn.active { background: var(--accent); color: #fff; }
    .content { flex: 1; padding: 28px; }

    /* SECTIONS */
    .section { display: none; }
    .section.active { display: block; }

    /* CARDS */
    .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 24px; margin-bottom: 20px; }
    .card-title { font-size: 1rem; font-weight: 700; color: #222; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }

    /* BUTTONS */
    .btn { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: .88rem; font-weight: 600; transition: background .15s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-danger { background: #fff0f0; color: #c62828; }
    .btn-danger:hover { background: #ffd5d5; }
    .btn-sm { padding: 5px 12px; font-size: .8rem; }

    /* FORMS */
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .form-group { flex: 1; min-width: 160px; }
    .form-group label { display: block; font-size: .82rem; font-weight: 600; color: #555; margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: .9rem; outline: none; font-family: inherit; transition: border .15s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 70px; }

    /* LIST */
    .category-block { margin-bottom: 24px; }
    .category-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #f0f2ff; border-radius: 10px; margin-bottom: 8px; }
    .category-name { font-weight: 700; color: #222; font-size: .95rem; }
    .dish-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #fafafa; border: 1px solid #eee; border-radius: 8px; margin-bottom: 6px; }
    .dish-info { flex: 1; }
    .dish-name { font-weight: 600; font-size: .92rem; color: #222; }
    .dish-desc { font-size: .8rem; color: #888; margin-top: 2px; }
    .dish-price { font-weight: 700; color: var(--accent); font-size: .95rem; margin: 0 16px; white-space: nowrap; }
    .dish-actions { display: flex; gap: 6px; }
    .toggle-available { font-size: 1.1rem; cursor: pointer; background: none; border: none; }
    .empty-state { text-align: center; color: #aaa; padding: 30px 0; font-size: .9rem; }

    /* THEMES */
    .themes { display: flex; gap: 10px; flex-wrap: wrap; }
    .theme-dot { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border .15s, transform .15s; }
    .theme-dot:hover { transform: scale(1.1); }
    .theme-dot.selected { border-color: #222; transform: scale(1.15); }

    /* QR */
    .qr-wrap { text-align: center; padding: 20px 0; }
    .qr-wrap img { border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .qr-url { font-size: .85rem; color: #666; margin-top: 12px; word-break: break-all; }

    /* ALERT */
    .alert { padding: 10px 14px; border-radius: 8px; font-size: .88rem; margin-bottom: 14px; display: none; }
    .alert.success { background: #e8f5e9; color: #1b5e20; display: block; }
    .alert.error { background: #fdecea; color: #b71c1c; display: block; }

    .spinner-wrap { text-align: center; padding: 40px; color: #aaa; font-size: .9rem; }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="app-name">🍽 MenuFlow</div>
    <div class="rest-name" id="sb-rest-name">...</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" onclick="showSection('menu')">
      <span class="icon">🍽</span><span id="nav-menu">Меню</span>
    </div>
    <div class="nav-item" onclick="showSection('settings')">
      <span class="icon">⚙️</span><span id="nav-settings">Настройки</span>
    </div>
    <div class="nav-item" onclick="showSection('qr')">
      <span class="icon">📱</span><span id="nav-qr">QR-код</span>
    </div>
  </nav>
  <div class="sidebar-footer">
    <button class="btn-logout" onclick="logout()">🚪 <span id="nav-logout">Выйти</span></button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <h1 id="page-title">Управление меню</h1>
    <div class="lang-btns">
      <button class="lang-btn" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('lv')">LV</button>
    </div>
  </div>
  <div class="content">

    <!-- МЕНЮ -->
    <div class="section active" id="section-menu">
      <!-- Добавить категорию -->
      <div class="card">
        <div class="card-title"><span id="t-addCat">Добавить категорию</span></div>
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label id="t-catName">Название категории</label>
            <input type="text" id="newCatName" id="t-catNamePH"/>
          </div>
          <div class="form-group" style="flex:0;align-self:flex-end">
            <button class="btn btn-primary" onclick="addCategory()" id="t-catBtn">+ Добавить</button>
          </div>
        </div>
      </div>

      <!-- Добавить блюдо -->
      <div class="card">
        <div class="card-title"><span id="t-addDish">Добавить блюдо</span></div>
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label id="t-dishName">Название</label>
            <input type="text" id="newDishName"/>
          </div>
          <div class="form-group" style="flex:1">
            <label id="t-dishPrice">Цена</label>
            <input type="number" id="newDishPrice" min="0" step="0.01"/>
          </div>
          <div class="form-group" style="flex:1">
            <label id="t-dishCat">Категория</label>
            <select id="newDishCat"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label id="t-dishDesc">Описание</label>
            <textarea id="newDishDesc"></textarea>
          </div>
        </div>
        <button class="btn btn-primary" onclick="addDish()" id="t-dishBtn">+ Добавить блюдо</button>
      </div>

      <!-- Список -->
      <div class="alert" id="menu-alert"></div>
      <div id="menu-list"><div class="spinner-wrap">⏳ Загрузка...</div></div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div class="section" id="section-settings">
      <div class="card">
        <div class="card-title"><span id="t-settingsTitle">Настройки ресторана</span></div>
        <div class="alert" id="settings-alert"></div>
        <div class="form-group" style="margin-bottom:16px">
          <label id="t-restName">Название ресторана</label>
          <input type="text" id="settingRestName"/>
        </div>
        <div style="margin-bottom:16px">
          <label style="display:block;font-size:.82rem;font-weight:600;color:#555;margin-bottom:8px" id="t-themeLabel">Тема оформления</label>
          <div class="themes">
            <div class="theme-dot" style="background:#3B5BDB" data-theme="blue"   data-color="#3B5BDB" data-dark="#2d4abf" onclick="selectTheme(this)"></div>
            <div class="theme-dot" style="background:#2E7D32" data-theme="green"  data-color="#2E7D32" data-dark="#1b5e20" onclick="selectTheme(this)"></div>
            <div class="theme-dot" style="background:#E65100" data-theme="orange" data-color="#E65100" data-dark="#bf360c" onclick="selectTheme(this)"></div>
            <div class="theme-dot" style="background:#C62828" data-theme="red"    data-color="#C62828" data-dark="#8e0000" onclick="selectTheme(this)"></div>
            <div class="theme-dot" style="background:#6A1B9A" data-theme="purple" data-color="#6A1B9A" data-dark="#4a148c" onclick="selectTheme(this)"></div>
            <div class="theme-dot" style="background:#00838F" data-theme="teal"   data-color="#00838F" data-dark="#005662" onclick="selectTheme(this)"></div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="saveSettings()" id="t-saveBtn">💾 Сохранить</button>
      </div>
    </div>

    <!-- QR -->
    <div class="section" id="section-qr">
      <div class="card">
        <div class="card-title"><span id="t-qrTitle">QR-код публичного меню</span></div>
        <div class="qr-wrap">
          <img id="qr-img" src="" alt="QR" style="width:220px;height:220px"/>
          <div class="qr-url" id="qr-url"></div>
          <br/>
          <a id="qr-download" download="menuflow-qr.png">
            <button class="btn btn-primary" style="margin-top:12px" id="t-qrDownload">⬇️ Скачать QR</button>
          </a>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var MF_DB = supabase.createClient('https://axidlwsjtgpehogbbjnt.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4aWRsd3NqdGdwZWhvZ2Jiam50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNTEwNzgsImV4cCI6MjA5MjgyNzA3OH0.wPkXnLrxWHnRKnc1uMv1Z7YRcRDaOI2BiIAEInx3DIs');
var currentLang = localStorage.getItem('mf_lang') || 'ru';
var currentTheme = 'blue';
var currentUser = null;
var restaurant = null;
var categories = [];
var dishes = [];

var T = {
  ru: { menu:'Меню', settings:'Настройки', qr:'QR-код', logout:'Выйти', pageMenu:'Управление меню', pageSettings:'Настройки', pageQr:'QR-код', addCat:'Добавить категорию', catName:'Название категории', catNamePH:'Например: Горячие блюда', catBtn:'+ Добавить', addDish:'Добавить блюдо', dishName:'Название', dishPrice:'Цена', dishCat:'Категория', dishDesc:'Описание', dishBtn:'+ Добавить блюдо', settingsTitle:'Настройки ресторана', restName:'Название ресторана', themeLabel:'Тема оформления', saveBtn:'💾 Сохранить', qrTitle:'QR-код публичного меню', qrDownload:'⬇️ Скачать QR', noCat:'Без категории', noItems:'Пока пусто', saved:'Сохранено!', errSave:'Ошибка сохранения', delConfirm:'Удалить?' },
  en: { menu:'Menu', settings:'Settings', qr:'QR Code', logout:'Sign Out', pageMenu:'Menu Management', pageSettings:'Settings', pageQr:'QR Code', addCat:'Add Category', catName:'Category name', catNamePH:'E.g.: Hot dishes', catBtn:'+ Add', addDish:'Add Dish', dishName:'Name', dishPrice:'Price', dishCat:'Category', dishDesc:'Description', dishBtn:'+ Add dish', settingsTitle:'Restaurant Settings', restName:'Restaurant name', themeLabel:'Color theme', saveBtn:'💾 Save', qrTitle:'Public Menu QR Code', qrDownload:'⬇️ Download QR', noCat:'No category', noItems:'Nothing here yet', saved:'Saved!', errSave:'Save error', delConfirm:'Delete?' },
  lv: { menu:'Izvēlne', settings:'Iestatījumi', qr:'QR kods', logout:'Iziet', pageMenu:'Izvēlnes pārvaldība', pageSettings:'Iestatījumi', pageQr:'QR kods', addCat:'Pievienot kategoriju', catName:'Kategorijas nosaukums', catNamePH:'Piemēram: Karstie ēdieni', catBtn:'+ Pievienot', addDish:'Pievienot ēdienu', dishName:'Nosaukums', dishPrice:'Cena', dishCat:'Kategorija', dishDesc:'Apraksts', dishBtn:'+ Pievienot ēdienu', settingsTitle:'Restorāna iestatījumi', restName:'Restorāna nosaukums', themeLabel:'Krāsu tēma', saveBtn:'💾 Saglabāt', qrTitle:'Publiskās izvēlnes QR kods', qrDownload:'⬇️ Lejupielādēt QR', noCat:'Bez kategorijas', noItems:'Pagaidām tukšs', saved:'Saglabāts!', errSave:'Saglabāšanas kļūda', delConfirm:'Dzēst?' }
};

function setLang(l) { currentLang = l; localStorage.setItem('mf_lang', l); applyLang(); }

function applyLang() {
  var t = T[currentLang];
  document.getElementById('nav-menu').textContent     = t.menu;
  document.getElementById('nav-settings').textContent = t.settings;
  document.getElementById('nav-qr').textContent       = t.qr;
  document.getElementById('nav-logout').textContent   = t.logout;
  document.getElementById('t-addCat').textContent     = t.addCat;
  document.getElementById('t-catName').textContent    = t.catName;
  document.getElementById('t-catBtn').textContent     = t.catBtn;
  document.getElementById('t-addDish').textContent    = t.addDish;
  document.getElementById('t-dishName').textContent   = t.dishName;
  document.getElementById('t-dishPrice').textContent  = t.dishPrice;
  document.getElementById('t-dishCat').textContent    = t.dishCat;
  document.getElementById('t-dishDesc').textContent   = t.dishDesc;
  document.getElementById('t-dishBtn').textContent    = t.dishBtn;
  document.getElementById('t-settingsTitle').textContent = t.settingsTitle;
  document.getElementById('t-restName').textContent   = t.restName;
  document.getElementById('t-themeLabel').textContent = t.themeLabel;
  document.getElementById('t-saveBtn').textContent    = t.saveBtn;
  document.getElementById('t-qrTitle').textContent    = t.qrTitle;
  document.getElementById('t-qrDownload').textContent = t.qrDownload;
  document.getElementById('newCatName').placeholder   = t.catNamePH;
  document.querySelectorAll('.lang-btn').forEach(function(b) {
    b.classList.toggle('active', b.textContent === currentLang.toUpperCase());
  });
  var active = document.querySelector('.nav-item.active');
  if (active) {
    var sec = active.getAttribute('onclick').match(/'(\w+)'/)[1];
    document.getElementById('page-title').textContent = t['page' + sec.charAt(0).toUpperCase() + sec.slice(1)] || '';
  }
}

function selectTheme(el) {
  document.querySelectorAll('.theme-dot').forEach(function(d) { d.classList.remove('selected'); });
  el.classList.add('selected');
  currentTheme = el.getAttribute('data-theme');
  document.documentElement.style.setProperty('--accent', el.getAttribute('data-color'));
  document.documentElement.style.setProperty('--accent-dark', el.getAttribute('data-dark'));
}

function applyTheme(theme) {
  var map = { blue:['#3B5BDB','#2d4abf'], green:['#2E7D32','#1b5e20'], orange:['#E65100','#bf360c'], red:['#C62828','#8e0000'], purple:['#6A1B9A','#4a148c'], teal:['#00838F','#005662'] };
  var c = map[theme] || map.blue;
  document.documentElement.style.setProperty('--accent', c[0]);
  document.documentElement.style.setProperty('--accent-dark', c[1]);
  currentTheme = theme;
  document.querySelectorAll('.theme-dot').forEach(function(d) {
    d.classList.toggle('selected', d.getAttribute('data-theme') === theme);
  });
}

function showSection(name) {
  document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  document.getElementById('section-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  document.getElementById('page-title').textContent = T[currentLang]['page' + name.charAt(0).toUpperCase() + name.slice(1)] || name;
  if (name === 'qr') generateQR();
  if (name === 'settings') loadSettings();
}

async function logout() {
  await MF_DB.auth.signOut();
  window.location.href = 'login.html';
}

async function init() {
  var { data: { session } } = await MF_DB.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  currentUser = session.user;
  await loadRestaurant();
  await loadMenu();
  applyLang();
}

async function loadRestaurant() {
  var { data } = await MF_DB.from('restaurants').select('*').eq('id', currentUser.id).single();
  if (data) {
    restaurant = data;
    document.getElementById('sb-rest-name').textContent = data.name;
    applyTheme(data.theme || 'blue');
    currentLang = data.lang || localStorage.getItem('mf_lang') || 'ru';
    localStorage.setItem('mf_lang', currentLang);
  }
}

async function loadMenu() {
  var { data: cats } = await MF_DB.from('categories').select('*').eq('restaurant_id', currentUser.id).order('position');
  var { data: dishs } = await MF_DB.from('dishes').select('*').eq('restaurant_id', currentUser.id).order('position');
  categories = cats || [];
  dishes = dishs || [];
  renderMenu();
  renderCatSelect();
}

function renderCatSelect() {
  var sel = document.getElementById('newDishCat');
  sel.innerHTML = '<option value="">' + T[currentLang].noCat + '</option>';
  categories.forEach(function(c) {
    var o = document.createElement('option');
    o.value = c.id; o.textContent = c.name; sel.appendChild(o);
  });
}

function renderMenu() {
  var el = document.getElementById('menu-list');
  if (!categories.length && !dishes.length) {
    el.innerHTML = '<div class="empty-state">🍽 ' + T[currentLang].noItems + '</div>'; return;
  }
  var html = '';
  categories.forEach(function(cat) {
    var catDishes = dishes.filter(function(d) { return d.category_id === cat.id; });
    html += '<div class="category-block"><div class="category-header"><span class="category-name">📂 ' + esc(cat.name) + '</span><button class="btn btn-danger btn-sm" onclick="deleteCategory(\'' + cat.id + '\')">🗑</button></div>';
    if (!catDishes.length) html += '<div style="padding:8px 14px;color:#bbb;font-size:.85rem">' + T[currentLang].noItems + '</div>';
    catDishes.forEach(function(d) { html += dishHTML(d); });
    html += '</div>';
  });
  var noCatDishes = dishes.filter(function(d) { return !d.category_id; });
  if (noCatDishes.length) {
    html += '<div class="category-block"><div class="category-header"><span class="category-name">📂 ' + T[currentLang].noCat + '</span></div>';
    noCatDishes.forEach(function(d) { html += dishHTML(d); });
    html += '</div>';
  }
  el.innerHTML = html;
}

function dishHTML(d) {
  return '<div class="dish-item"><div class="dish-info"><div class="dish-name">' + esc(d.name) + '</div>' +
    (d.description ? '<div class="dish-desc">' + esc(d.description) + '</div>' : '') + '</div>' +
    '<div class="dish-price">' + (d.price ? d.price + ' €' : '—') + '</div>' +
    '<div class="dish-actions">' +
    '<button class="toggle-available" title="Доступность" onclick="toggleDish(\'' + d.id + '\',' + d.available + ')">' + (d.available ? '✅' : '❌') + '</button>' +
    '<button class="btn btn-danger btn-sm" onclick="deleteDish(\'' + d.id + '\')">🗑</button>' +
    '</div></div>';
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function addCategory() {
  var name = document.getElementById('newCatName').value.trim();
  if (!name) return;
  var { error } = await MF_DB.from('categories').insert({ restaurant_id: currentUser.id, name: name, position: categories.length });
  if (!error) { document.getElementById('newCatName').value = ''; await loadMenu(); }
}

async function deleteCategory(id) {
  if (!confirm(T[currentLang].delConfirm)) return;
  await MF_DB.from('categories').delete().eq('id', id);
  await loadMenu();
}

async function addDish() {
  var name  = document.getElementById('newDishName').value.trim();
  var price = document.getElementById('newDishPrice').value;
  var catId = document.getElementById('newDishCat').value || null;
  var desc  = document.getElementById('newDishDesc').value.trim();
  if (!name) return;
  var { error } = await MF_DB.from('dishes').insert({ restaurant_id: currentUser.id, name: name, price: price || null, category_id: catId, description: desc, position: dishes.length });
  if (!error) {
    document.getElementById('newDishName').value = '';
    document.getElementById('newDishPrice').value = '';
    document.getElementById('newDishDesc').value = '';
    await loadMenu();
  }
}

async function deleteDish(id) {
  if (!confirm(T[currentLang].delConfirm)) return;
  await MF_DB.from('dishes').delete().eq('id', id);
  await loadMenu();
}

async function toggleDish(id, current) {
  await MF_DB.from('dishes').update({ available: !current }).eq('id', id);
  await loadMenu();
}

function loadSettings() {
  if (restaurant) {
    document.getElementById('settingRestName').value = restaurant.name || '';
    applyTheme(restaurant.theme || 'blue');
  }
}

async function saveSettings() {
  var name = document.getElementById('settingRestName').value.trim();
  if (!name) return;
  var alertEl = document.getElementById('settings-alert');
  var { error } = await MF_DB.from('restaurants').update({ name: name, theme: currentTheme, lang: currentLang }).eq('id', currentUser.id);
  if (!error) {
    restaurant.name = name; restaurant.theme = currentTheme;
    document.getElementById('sb-rest-name').textContent = name;
    alertEl.className = 'alert success'; alertEl.textContent = T[currentLang].saved;
    setTimeout(function() { alertEl.className = 'alert'; }, 2500);
  } else {
    alertEl.className = 'alert error'; alertEl.textContent = T[currentLang].errSave;
  }
}

function generateQR() {
  if (!currentUser) return;
  var publicUrl = 'https://headymanner.github.io/MenuFlow/menu.html?id=' + currentUser.id;
  var qrApi = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(publicUrl);
  document.getElementById('qr-img').src = qrApi;
  document.getElementById('qr-url').textContent = publicUrl;
  document.getElementById('qr-download').href = qrApi;
}

init();
applyLang();
</script>
